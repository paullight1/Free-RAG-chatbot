services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    # Only the application container needs DB access in normal operation.
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  qdrant-data:
